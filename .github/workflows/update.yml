name: Update Boilerplate Dependencies

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boilerplate-dependency-updates
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      boilerplates: ${{ steps.boilerplates.outputs.matrix }}
      specialized: ${{ steps.specialized.outputs.matrix }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: python3 -m pip install --upgrade pip pyyaml requests

      - name: Validate Updater
        run: |
          bash -n scripts/update-dependencies.sh
          bash -n scripts/update-specialized.sh
          python3 -m unittest discover -s tests

      - name: Build Boilerplate Matrix
        id: boilerplates
        run: echo "matrix=$(python3 scripts/update_config.py matrix)" >> "${GITHUB_OUTPUT}"

      - name: Build Specialized Boilerplate Matrix
        id: specialized
        run: echo "matrix=$(python3 scripts/update_config.py specialized-matrix)" >> "${GITHUB_OUTPUT}"

  update:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boilerplate: ${{ fromJSON(needs.checks.outputs.boilerplates) }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: python3 -m pip install --upgrade pip pyyaml

      - name: Log In to Docker Hub
        if: github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      - name: Update and Validate Dependencies
        env:
          BOILERPLATE_UPDATE_PUSH: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          BOILERPLATE_UPDATE_REPORT_FILE: boilerplate-update-reports/${{ matrix.boilerplate }}/events.jsonl
          WODBOT_GITHUB_PAT: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GITHUB_PAT || '' }}
          WODBOT_GITHUB_USERNAME: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GITHUB_USERNAME || '' }}
          WODBOT_GIT_EMAIL: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GIT_EMAIL || '' }}
          WODBOT_GIT_NAME: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GIT_NAME || '' }}
        run: |
          mkdir -p "$(dirname "${BOILERPLATE_UPDATE_REPORT_FILE}")"
          : > "${BOILERPLATE_UPDATE_REPORT_FILE}"
          scripts/update-dependencies.sh "${{ matrix.boilerplate }}"

      - name: Log Out of Docker Hub
        if: always() && github.event_name != 'pull_request'
        run: docker logout || true

      - name: Upload Update Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boilerplate-update-report-${{ matrix.boilerplate }}
          path: boilerplate-update-reports/${{ matrix.boilerplate }}
          if-no-files-found: warn
          retention-days: 14

  specialized:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boilerplate: ${{ fromJSON(needs.checks.outputs.specialized) }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Log In to Docker Hub
        if: github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      - name: Update Specialized Boilerplate
        env:
          BOILERPLATE_UPDATE_PUSH: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          BOILERPLATE_UPDATE_REPORT_FILE: boilerplate-update-reports/${{ matrix.boilerplate }}/events.jsonl
          WODBOT_GITHUB_PAT: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GITHUB_PAT || '' }}
          WODBOT_GITHUB_USERNAME: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GITHUB_USERNAME || '' }}
          WODBOT_GIT_EMAIL: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GIT_EMAIL || '' }}
          WODBOT_GIT_NAME: ${{ github.event_name != 'pull_request' && secrets.WODBOT_GIT_NAME || '' }}
        run: |
          mkdir -p "$(dirname "${BOILERPLATE_UPDATE_REPORT_FILE}")"
          : > "${BOILERPLATE_UPDATE_REPORT_FILE}"
          docker run --rm \
            --entrypoint /bin/bash \
            -e BOILERPLATE_UPDATE_PUSH \
            -e WODBOT_GITHUB_PAT \
            -e WODBOT_GITHUB_USERNAME \
            -e WODBOT_GIT_EMAIL \
            -e WODBOT_GIT_NAME \
            -e BOILERPLATE_UPDATE_REPORT_FILE="/boilerplates/${BOILERPLATE_UPDATE_REPORT_FILE}" \
            -v "${PWD}:/boilerplates" \
            wodby/docker:dev@sha256:733230bc461c3a4173fea8fe835bc58bf9698fc58c701510d10edc6b9c1af09b \
            /boilerplates/scripts/update-specialized.sh "${{ matrix.boilerplate }}"

      - name: Log Out of Docker Hub
        if: always() && github.event_name != 'pull_request'
        run: docker logout || true

      - name: Upload Update Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boilerplate-update-report-${{ matrix.boilerplate }}
          path: boilerplate-update-reports/${{ matrix.boilerplate }}
          if-no-files-found: warn
          retention-days: 14

  notify:
    name: Notify Report Events
    needs:
      - checks
      - update
      - specialized
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Download Report Artifacts
        id: download-reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: boilerplate-update-report-*
          path: reports

      - name: Generate Boilerplate Update Report
        run: |
          python3 scripts/boilerplate_update_report.py \
            --events-dir reports \
            --output-dir boilerplate-update-report

      - name: Upload Consolidated Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boilerplate-update-report
          path: boilerplate-update-report
          if-no-files-found: warn
          retention-days: 14

      - name: Send Email Digest
        if: github.event_name != 'pull_request'
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: |
          python3 scripts/boilerplate_report_email.py boilerplate-update-report \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event "${{ github.event_name }}" \
            --sha "${{ github.sha }}" \
            --workflow-result "checks=${{ needs.checks.result }}, update=${{ needs.update.result }}, specialized=${{ needs.specialized.result }}" \
            --artifact-result "${{ steps.download-reports.outcome }}"
